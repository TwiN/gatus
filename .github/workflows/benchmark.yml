name: benchmark
on:
  workflow_run:
    workflows: [publish-latest]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to checkout. Useful for benchmarking a fork. Format should be <owner>/<repository>."
        required: true
        default: "TwiN/gatus"
      ref:
        description: "Branch, tag or SHA to checkout"
        required: true
        default: "master"
permissions:
  contents: read

jobs:
  build:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.3
          repository: "${{ github.event.inputs.repository || 'TwiN/gatus' }}"
          ref: "${{ github.event.inputs.ref || 'master' }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Benchmark
        run: go test -bench=. ./storage/store
