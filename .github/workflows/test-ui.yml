name: test-ui
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches:
      - master
    paths:
      - 'web/**'
permissions:
  contents: read

jobs:
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make frontend-install
      - run: make frontend-build