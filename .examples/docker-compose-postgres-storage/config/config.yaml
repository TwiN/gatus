storage:
  type: postgres
  # Key-value (DSN) format is recommended because it supports passwords containing URL-reserved characters
  # (e.g. '#', '@', '?', '&', '=') without requiring URL-encoding. Note: literal single quotes or backslashes must be escaped with \' or \\.
  path: "user=${POSTGRES_USER} password='${POSTGRES_PASSWORD}' host=postgres port=5432 dbname=${POSTGRES_DB} sslmode=disable"
  # Alternatively, if using the URI format, any special characters in the user or password must be URL-encoded (e.g. '#' as '%23'):
  # path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

endpoints:
  - name: back-end
    group: core
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 48h"

  - name: monitoring
    group: internal
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: nas
    group: internal
    url: "https://example.org/"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  - name: example-dns-query
    url: "8.8.8.8" # Address of the DNS server to use
    interval: 5m
    dns:
      query-name: "example.com"
      query-type: "A"
    conditions:
      - "[BODY] == 93.184.215.14"
      - "[DNS_RCODE] == NOERROR"

  - name: icmp-ping
    url: "icmp://example.org"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
